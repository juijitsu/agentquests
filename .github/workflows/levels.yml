name: levels

on: [push, pull_request]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Node 24 снимает типы с .ts сам — сборки и пакетов нет.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python engine/selftest.py
